name: Public repository security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check public-repository policy
        run: python3 scripts/check_public_repo.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Exercise synthetic dry run
        run: |
          python3 skills/jev-assess-role/scripts/jev_assess.py \
            --questionnaire tests/fixtures/synthetic/questionnaire.json \
            --tailored-resume tests/fixtures/synthetic/recommended_resume.json \
            --long-form tests/fixtures/synthetic/long_form_history.json \
            --output-dir "$RUNNER_TEMP/jev-results" \
            --dry-run
      - name: Validate TypeScript MCP server
        working-directory: server
        run: |
          npm ci
          npm run check
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
